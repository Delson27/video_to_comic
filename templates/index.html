<!DOCTYPE html>
<html lang="en" class="h-100" data-bs-theme="auto">
  <head>
    <script src="../assets/js/color-modes.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" />
    <meta
      name="author"
      content="Mark Otto, Jacob Thornton, and Bootstrap contributors"
    />
    <meta name="generator" content="Hugo 0.122.0" />
    <title>AutoComic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@docsearch/css@3"
    />
    <link
      href="{{url_for('static', filename='bootstrap.min.css')}}"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='styles.css')}}"
    />
    <link href="{{url_for('static', filename='cover.css')}}" rel="stylesheet" />
  </head>

  <body class="d-flex h-100 text-center text-bg-dark">
    <!-- The video -->
    <video autoplay muted loop id="bgVideo">
      <source
        src="{{ url_for('static', filename='bg.mp4') }}"
        type="video/mp4"
      />
    </video>

    <div class="carousel">
      <div id="preview-container">
        <div id="video-container">
          <video id="video-preview" controls autoplay></video>
        </div>
        <div id="iframe-container">
          <iframe
            id="iframe-preview"
            width="560"
            height="415"
            src="#"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      </div>
      <div class="box" id="box">
        <h1 id="title">AutoComic</h1>
        <p id="description">An automated video-to-comic generator</p>
        <div class="button-container">
          <input
            type="file"
            id="fileInput"
            accept=".mp4"
            style="display: none"
          />
          <button onclick="openFilePicker()" class="icon-button">
            <img
              src="{{url_for('static', filename='images/upload.png')}}"
              alt="Upload Video"
            />
          </button>
          <button onclick="toggleLinkInput()" class="icon-button">
            <img
              src="{{url_for('static', filename='images/link.png')}}"
              alt="Enter Link"
            />
          </button>
        </div>
        <div id="linkInputContainer" style="display: none">
          <input type="text" id="link-input" placeholder="Enter Link" />
        </div>
        <p id="fileName"></p>
        <button onclick="submitForm()" class="submit-button" id="submitButton">
          Submit
        </button>
        <p id="submissionResult"></p>

        <!-- Progress Bar Section -->
        <div id="progress-container" style="display: none">
          <div id="progress-bar" style="width: 0%"></div>
          <div id="progress-text-overlay">0%</div>
        </div>
        <p id="progress-text" class="status-message"></p>
        <a
          id="view-comic-link"
          href="#"
          class="view-comic-button"
          style="display: none"
          target="_blank"
          >View Comic</a
        >

        <div id="resultButtons" style="display: none">
          <button
            onclick="previewComic()"
            class="submit-button"
            id="previewButton"
          >
            Preview Comic
          </button>
          <button
            onclick="downloadPDF()"
            class="submit-button"
            id="downloadButton"
          >
            Download as PDF
          </button>
        </div>
      </div>
    </div>
    <!-- PDF Download Progress Modal -->
    <div id="pdfDownloadModal" class="pdf-modal" style="display: none;">
      <div class="pdf-modal-content">
        <h3 id="pdfModalTitle">Preparing PDF...</h3>
        <div class="pdf-progress-container">
          <div id="pdfProgressBar" class="pdf-progress-bar"></div>
          <div id="pdfProgressText" class="pdf-progress-text">0%</div>
        </div>
        <p id="pdfModalMessage" class="pdf-modal-message">Rendering comic pages...</p>
        <div id="pdfModalIcon" class="pdf-modal-icon"></div>
      </div>
    </div>

    <script>
      function downloadPDF() {
        const modal = document.getElementById('pdfDownloadModal');
        const modalTitle = document.getElementById('pdfModalTitle');
        const modalMessage = document.getElementById('pdfModalMessage');
        const modalIcon = document.getElementById('pdfModalIcon');
        const progressBar = document.getElementById('pdfProgressBar');
        const progressText = document.getElementById('pdfProgressText');
        const downloadBtn = document.getElementById('downloadButton');

        // Show modal
        modal.style.display = 'flex';
        downloadBtn.disabled = true;
        downloadBtn.textContent = 'Downloading...';
        downloadBtn.style.opacity = '0.6';

        // Reset modal state
        modalTitle.textContent = 'Preparing PDF...';
        modalMessage.textContent = 'Rendering comic pages...';
        modalIcon.className = 'pdf-modal-icon';
        modalIcon.innerHTML = '';
        progressBar.style.width = '0%';
        progressBar.style.backgroundColor = '#3b82f6';
        progressText.textContent = '0%';

        // Simulate progress (since PDF generation happens on backend)
        let progress = 0;
        const progressInterval = setInterval(() => {
          if (progress < 90) {
            progress += Math.random() * 15;
            if (progress > 90) progress = 90;
            progressBar.style.width = progress + '%';
            progressText.textContent = Math.round(progress) + '%';
            
            // Update message based on progress
            if (progress < 30) {
              modalMessage.textContent = 'Rendering comic pages...';
            } else if (progress < 60) {
              modalMessage.textContent = 'Compressing images...';
            } else {
              modalMessage.textContent = 'Finalizing PDF...';
            }
          }
        }, 200);

        fetch("/generate-pdf", { method: "GET" })
          .then((response) => {
            if (!response.ok) {
              return response.json().then((data) => {
                throw new Error(data.error || "Failed to generate PDF");
              });
            }
            return response.blob();
          })
          .then((blob) => {
            clearInterval(progressInterval);
            
            // Complete progress
            progressBar.style.width = '100%';
            progressBar.style.backgroundColor = '#22c55e';
            progressText.textContent = '100%';
            
            // Show success state
            modalTitle.textContent = 'Download Complete!';
            modalMessage.textContent = 'Your comic PDF has been downloaded successfully.';
            modalIcon.className = 'pdf-modal-icon success';
            modalIcon.innerHTML = '✓';

            // Create a download link and trigger it
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "comic_strip.pdf";
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

            // Reset button
            downloadBtn.disabled = false;
            downloadBtn.textContent = 'Download as PDF';
            downloadBtn.style.opacity = '1';

            // Close modal after 2 seconds
            setTimeout(() => {
              modal.style.display = 'none';
            }, 2000);
          })
          .catch((error) => {
            clearInterval(progressInterval);
            
            // Show error state
            progressBar.style.width = '100%';
            progressBar.style.backgroundColor = '#ef4444';
            progressText.textContent = 'Failed';
            
            modalTitle.textContent = 'Download Failed';
            modalMessage.textContent = error.message || 'An error occurred while generating the PDF.';
            modalIcon.className = 'pdf-modal-icon error';
            modalIcon.innerHTML = '✕';

            // Reset button
            downloadBtn.disabled = false;
            downloadBtn.textContent = 'Download as PDF';
            downloadBtn.style.opacity = '1';

            // Close modal after 3 seconds
            setTimeout(() => {
              modal.style.display = 'none';
            }, 3000);
          });
      }

      // Allow closing modal by clicking outside
      window.onclick = function(event) {
        const modal = document.getElementById('pdfDownloadModal');
        if (event.target === modal) {
          modal.style.display = 'none';
        }
      };
    </script>
    <script src="{{url_for('static', filename='script.js')}}"></script>
    <script src="{{url_for('static', filename='bootstrap.bundle.min.js')}}"></script>
  </body>
</html>
